# SahlPay.ma - Plateforme Big Data (Ecosysteme Big Data 2, 5eme annee EMSI)
# Jalon 1 : Parties 1, 2 et 3 (cluster + batch RDD + Spark SQL)
#
# Services : Kafka (KRaft) / Spark Master + 2 Workers / MinIO / Jupyter PySpark
# Lancement : docker compose up -d --build

services:

  # ------------------------------------------------------------------
  # Kafka en mode KRaft (sans ZooKeeper) - bus de messages, 3 partitions
  # ------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: sahlpay-kafka
    ports:
      - "9092:9092"    # listener EXTERNAL (depuis l'hote : localhost:9092)
      - "9093:9093"    # controller KRaft
    environment:
      # --- role KRaft : un seul noeud a la fois broker et controller ---
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # --- listeners : INTERNAL pour les conteneurs, EXTERNAL pour l'hote ---
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # --- defauts topics : 3 partitions comme demande au 3.1.2 ---
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [sahlpay]

  # Job ephemere : cree le topic "transactions" avec 3 partitions puis s'arrete
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: sahlpay-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-kafka.sh"]
    volumes:
      - ./scripts:/scripts:ro
    networks: [sahlpay]

  # ------------------------------------------------------------------
  # MinIO - stockage objet compatible S3 (couches Bronze / Silver / Gold)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: sahlpay-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # API S3
      - "9001:9001"    # console web
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [sahlpay]

  # Job ephemere : cree le bucket "lake" et ses prefixes
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: sahlpay-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - ./scripts:/scripts:ro
    networks: [sahlpay]

  # ------------------------------------------------------------------
  # Spark 3.5 en standalone : 1 Master + 2 Workers
  # Image construite a partir de docker/Dockerfile.spark : elle ajoute
  # les JAR hadoop-aws / aws-sdk (S3A vers MinIO), Kafka et Delta Lake.
  # ------------------------------------------------------------------
  spark-master:
    build:
      context: ./docker
      dockerfile: Dockerfile.spark
    image: sahlpay/spark:3.5
    container_name: sahlpay-spark-master
    environment:
      SPARK_MODE: "master"
      SPARK_MASTER_HOST: "spark-master"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"    # Spark Master UI  -> preuve "2 Workers actifs"
      - "7077:7077"    # spark://spark-master:7077
    volumes:
      - ./jobs:/opt/sahlpay/jobs:ro
      - ./data:/opt/sahlpay/data
      - ./producer:/opt/sahlpay/producer:ro
      - spark-events:/opt/sahlpay/spark-events
    networks: [sahlpay]

  spark-worker-1:
    image: sahlpay/spark:3.5
    container_name: sahlpay-spark-worker-1
    depends_on: [spark-master]
    environment:
      SPARK_MODE: "worker"
      SPARK_MASTER_URL: "spark://spark-master:7077"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8081:8081"
    volumes:
      - ./jobs:/opt/sahlpay/jobs:ro
      - ./data:/opt/sahlpay/data
      - spark-events:/opt/sahlpay/spark-events
    networks: [sahlpay]

  spark-worker-2:
    image: sahlpay/spark:3.5
    container_name: sahlpay-spark-worker-2
    depends_on: [spark-master]
    environment:
      SPARK_MODE: "worker"
      SPARK_MASTER_URL: "spark://spark-master:7077"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8082:8081"
    volumes:
      - ./jobs:/opt/sahlpay/jobs:ro
      - ./data:/opt/sahlpay/data
      - spark-events:/opt/sahlpay/spark-events
    networks: [sahlpay]

  # ------------------------------------------------------------------
  # Jupyter PySpark - notebooks d'exploration, memes JAR que le cluster
  # ------------------------------------------------------------------
  jupyter:
    build:
      context: ./docker
      dockerfile: Dockerfile.jupyter
    image: sahlpay/jupyter:3.5
    container_name: sahlpay-jupyter
    depends_on: [spark-master]
    ports:
      - "8888:8888"    # token fixe : voir JUPYTER_TOKEN
      - "4040:4040"    # Spark UI du driver lance depuis le notebook
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-sahlpay}"
      SPARK_MASTER_URL: "spark://spark-master:7077"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      KAFKA_BOOTSTRAP: "kafka:29092"
      PYSPARK_PYTHON: "python3"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./jobs:/home/jovyan/work/jobs
      - ./data:/home/jovyan/work/data
      - ./producer:/home/jovyan/work/producer
    networks: [sahlpay]

volumes:
  kafka-data:
  minio-data:
  spark-events:

networks:
  sahlpay:
    name: sahlpay
    driver: bridge
